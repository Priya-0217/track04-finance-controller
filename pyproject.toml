[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-finance-controller"
version = "0.1.0"
description = "Razorpay AI Buildathon (Track 04) - Automated Financial Reconciliation & Settlement Q&A"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.8.0",
    "sentence-transformers>=3.0.0",
    "optimum>=1.20.0",
    "onnxruntime>=1.18.0",
    "tiktoken>=0.7.0",
    "litellm>=1.40.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.9"
]

[project.scripts]
fin = "cli.financectl:app"
financectl = "cli.financectl:app"

[tool.hatch.build.targets.wheel]
packages = ["cli", "engine", "qa", "eval", "data"]

[tool.hatch.build.targets.wheel.force-include]
"app.py" = "app.py"
"static_dist" = "static_dist"

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0"
]
